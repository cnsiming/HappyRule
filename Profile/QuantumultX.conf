# QuantumultX 个人配置模板（骨架）
# 用法：复制为本地 conf 后，把策略组 server 引用换成你的订阅
# 规则订阅: https://raw.githubusercontent.com/cnsiming/HappyRule/rules/dist/qx/

[general]
server_check_url=http://www.gstatic.com/generate_204
dns_exclusion_list=*.localnetwork

[dns]
no-system
server=223.5.5.5
server=119.29.29.29

[policy]
# 与你的旁路由 PassWall 分组一一对应
static=AI-ChatGPT, server-tag-regex=^(?=.*(日本|JP|Japan)).*$, img-url=https://raw.githubusercontent.com/cnsiming/HappyRule/rules/Icon/ai-chatgpt.png
static=AI-Claude, server-tag-regex=^(?=.*(日本|JP|Japan)).*$, img-url=https://raw.githubusercontent.com/cnsiming/HappyRule/rules/Icon/ai-claude.png
static=AI-Muse, server-tag-regex=^(?=.*(美国|US|United States)).*$, img-url=https://raw.githubusercontent.com/cnsiming/HappyRule/rules/Icon/ai-muse.png
static=韩国服务, server-tag-regex=^(?=.*(韩国|KR|Korea)).*$, img-url=https://raw.githubusercontent.com/cnsiming/HappyRule/rules/Icon/korea.png

[filter_remote]
https://raw.githubusercontent.com/cnsiming/HappyRule/rules/dist/qx/Ads.list, tag=HappyAds, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/cnsiming/HappyRule/rules/dist/qx/AntiTracking.list, tag=HappyTracking, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true

[filter_local]
# 分流规则从 Rules/ 目录复制，行尾策略组名与 [policy] 保持一致
